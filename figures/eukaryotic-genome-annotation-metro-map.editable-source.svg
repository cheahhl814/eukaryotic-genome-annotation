<!--
eukaryotic-genome-annotation · svg-library · metro-map (derived from design-pack svg-library metro-map)
  Transit-map pipeline: three numbered section panels (1 input and repeat masking,
  2 gene prediction evidence routing, 3 ncRNA, functional and QC), a QC gate, a
  repeat-masking detour, a three-way gene-prediction split that re-merges, dotted
  optional spurs (ncRNA, functional), file-icon inputs/outputs and a legend.
  Tokens: teal amber coral green text text-muted surface border font-head font-sans.
  Edit: station labels, file tags (FASTA/MASKED/GFF3+FAA/GAF-TSV/REPORT), section titles, legend text.
  Routes are one path per colour; bundle offsets are teal -6, amber 0, coral +6
  around trunk y=180. Capsules mark stations every route passes; circles mark a
  single route (or an interchange on the bundled trunk). Delete a route = delete its
  path, its stations and its legend row. Dotted green = skippable spur.
  No ids/markers, safe to paste multiples.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Genome annotation pipeline metro map: assembly QC gate, repeat masking, three gene-prediction routes re-merging, then ncRNA, functional annotation and QC" style="width:100%;height:auto">
